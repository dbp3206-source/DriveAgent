<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Omnize Study - Trò chuyện</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-highest": "#e1e3e0",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a",
            "tertiary-container": "#78433a",
            "surface-container-low": "#f2f4f1",
            "inverse-on-surface": "#f0f1ee",
            "on-secondary-fixed": "#0b1f19",
            "on-primary-fixed-variant": "#155040",
            "on-background": "#191c1b",
            "on-surface-variant": "#404945",
            "surface-tint": "#316857",
            "on-tertiary": "#ffffff",
            "surface": "#f8faf7",
            "secondary-fixed-dim": "#b5ccc2",
            "outline-variant": "#bfc9c3",
            "surface-container-high": "#e7e9e6",
            "primary": "#024335",
            "on-primary": "#ffffff",
            "surface-container": "#edeeeb",
            "secondary": "#4e635b",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#fdb5a8",
            "on-tertiary-fixed-variant": "#6b3930",
            "on-tertiary-fixed": "#360f09",
            "on-primary-container": "#98d1bc",
            "tertiary": "#5d2d25",
            "primary-fixed": "#b5efd9",
            "error": "#ba1a1a",
            "primary-container": "#235b4b",
            "outline": "#707975",
            "inverse-surface": "#2e312f",
            "on-primary-fixed": "#002118",
            "on-secondary-container": "#546961",
            "secondary-container": "#d1e8dd",
            "primary-fixed-dim": "#99d2be",
            "on-surface": "#191c1b",
            "error-container": "#ffdad6",
            "on-secondary-fixed-variant": "#374b43",
            "surface-dim": "#d9dad8",
            "on-error": "#ffffff",
            "secondary-fixed": "#d1e8dd",
            "on-tertiary-container": "#fbb3a7",
            "background": "#f8faf7",
            "tertiary-fixed": "#ffdad4",
            "surface-bright": "#f8faf7",
            "inverse-primary": "#99d2be",
            "surface-variant": "#e1e3e0"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {},
          "fontFamily": {
            "headline": [
              "Be Vietnam Pro"
            ],
            "display": [
              "Be Vietnam Pro"
            ],
            "body": [
              "Be Vietnam Pro"
            ],
            "label": [
              "Public Sans"
            ]
          },
          "fontSize": {}
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased flex h-screen overflow-hidden">
<!-- SideNavBar -->
<nav class="fixed left-0 top-0 h-full w-[280px] flex border-r border-outline-variant bg-surface-container-low dark:bg-surface-container-low flex-row z-20">
<!-- Slim Left Icon Rail (56px) -->
<div class="w-14 flex flex-col items-center py-4 border-r border-outline-variant bg-surface-container-lowest h-full z-10 shrink-0">
<!-- Primary Action / Brand (Top) -->
<button class="w-10 h-10 mb-6 flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors text-primary" title="Trang chủ">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dataset</span>
</button>
<!-- Navigation Icons -->
<div class="flex flex-col gap-2 w-full px-2">
<!-- Active Tab -->
<button class="w-10 h-10 flex items-center justify-center rounded-lg bg-secondary-container text-on-secondary-container transition-colors" title="Trò chuyện">
<span class="material-symbols-outlined" data-icon="chat" style="font-variation-settings: 'FILL' 1;">chat</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Tài liệu">
<span class="material-symbols-outlined" data-icon="description">description</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Điều đã ghi nhớ">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Nhật ký xử lý">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Phân quyền">
<span class="material-symbols-outlined" data-icon="group_add">group_add</span>
</button>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Bottom Actions -->
<div class="flex flex-col gap-2 w-full px-2 mb-2">
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Cài đặt">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Trợ giúp">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
<!-- Avatar (Bottom) -->
<div class="mt-2 mb-4 w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-xs font-semibold select-none">
        U
      </div>
</div>
<!-- Grouped Sidebar (224px) -->
<div class="flex-1 h-full flex flex-col bg-surface-container-low pt-4 px-3">
<!-- Header Area -->
<div class="mb-6 px-1">
<h1 class="text-lg font-headline font-bold text-primary dark:text-primary-fixed leading-tight">Workspace</h1>
<p class="text-[13px] text-on-surface-variant mt-0.5">Phòng học yên tĩnh</p>
</div>
<!-- CTA -->
<button class="w-full flex items-center justify-center gap-2 py-2 px-4 bg-primary text-on-primary rounded-lg text-[14px] font-medium hover:bg-primary-container transition-colors mb-6 shadow-sm active:opacity-80">
<span class="material-symbols-outlined text-[18px]">add</span>
        Tạo mới
      </button>
<!-- Section: Gần đây -->
<div class="flex-1 flex flex-col min-h-0">
<h2 class="text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider mb-3 px-2">Gần đây</h2>
<!-- Empty State -->
<div class="flex-1 flex flex-col items-center justify-center text-center px-4 pb-12">
<span class="material-symbols-outlined text-4xl text-outline-variant mb-3">chat_bubble_outline</span>
<p class="text-[14px] text-on-surface-variant">Chưa có cuộc trò chuyện</p>
</div>
</div>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex flex-col flex-1 ml-[280px] w-[calc(100%-280px)] h-screen bg-surface-container-lowest">
<!-- TopNavBar -->
<header class="flex justify-between items-center w-full px-6 h-12 border-b border-outline-variant bg-surface dark:bg-surface shrink-0">
<div class="flex items-center gap-4">
<span class="text-[22px] font-headline font-semibold text-primary dark:text-primary-fixed">Omnize Study</span>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">cloud_done</span>
<span class="font-label text-[13px] tracking-wide">Google Drive Connected</span>
</div>
<button class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors transition-opacity duration-150">
<span class="material-symbols-outlined" data-icon="notifications_none">notifications_none</span>
</button>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto relative flex flex-col items-center pt-16 pb-32 px-4">
<!-- Canvas Header -->
<div class="w-full max-w-3xl text-center mb-16">
<h1 class="text-[28px] font-headline font-bold text-on-surface mb-2">Không gian học tập</h1>
</div>
<!-- Suggestions Container -->
<div class="w-full max-w-2xl flex flex-col items-center">
<h2 class="text-[18px] font-semibold text-on-surface mb-2">Bạn muốn tìm hiểu điều gì?</h2>
<p class="text-[14px] text-on-surface-variant mb-8 text-center">Chọn một tài liệu, đặt câu hỏi và kiểm tra nguồn cùng trợ lý.</p>
<!-- Suggestions List -->
<div class="w-full flex flex-col gap-2 max-w-lg">
<button class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left group">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">psychology</span>
<span class="text-[14px] text-on-surface font-medium flex-1">Giải thích một nội dung khó</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity text-[18px]">arrow_forward</span>
</button>
<button class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left group">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">summarize</span>
<span class="text-[14px] text-on-surface font-medium flex-1">Tóm tắt tài liệu để ôn tập</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity text-[18px]">arrow_forward</span>
</button>
<button class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left group">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">travel_explore</span>
<span class="text-[14px] text-on-surface font-medium flex-1">Tìm thông tin trong Google Drive</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Bottom Composer -->
<div class="absolute bottom-0 left-[280px] right-0 p-6 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest to-transparent z-10 flex flex-col items-center pointer-events-none">
<div class="w-full max-w-3xl flex flex-col pointer-events-auto">
<!-- Input Area -->
<div class="relative flex items-end p-2 border border-outline-variant rounded-xl bg-surface focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-lg flex items-center justify-center shrink-0" title="Đính kèm tài liệu">
<span class="material-symbols-outlined">attach_file</span>
</button>
<textarea class="flex-1 max-h-32 min-h-[40px] bg-transparent border-none focus:ring-0 resize-none py-2 px-2 text-[15px] text-on-surface placeholder-on-surface-variant font-body leading-relaxed" placeholder="Hỏi về tài liệu của bạn..." rows="1"></textarea>
<button class="p-2 w-10 h-10 ml-2 bg-primary text-on-primary hover:bg-primary-container transition-colors rounded-lg flex items-center justify-center shrink-0" title="Gửi">
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
<!-- Source Hint & Inspector Trigger -->
<div class="flex justify-between items-center mt-3 px-1">
<div class="flex items-center gap-1.5 text-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>Chỉ dùng nguồn bạn đã cấp quyền</span>
</div>
<button class="flex items-center gap-1.5 text-xs font-medium text-secondary hover:text-primary transition-colors">
<span>Trợ lý đã làm gì?</span>
<span class="material-symbols-outlined text-[16px]">bottom_panel_open</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
