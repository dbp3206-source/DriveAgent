[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drive-agent-backend"
version = "0.1.0"
description = "Local-first Google Drive agent with governed tools, RAG and memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=2.19,<3",
  "google-adk==2.8.0",
  # ADK 2.8 caps OpenTelemetry at 1.42; api-core 2.36 requires 1.44.
  "google-api-core<2.36",
  "mcp==2.2.0",
  "a2a-sdk[http-server]==1.1.2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.25,<5",
  "langchain-core>=0.3.75,<2",
  "langchain-google-genai>=2.1.10,<4",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.2,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.15,<2",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
